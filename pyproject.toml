[project]
name = "govcore-django-template"
version = "0.1.0"
requires-python = ">=3.13"

[tool.ruff]
line-length = 119
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"**/settings/*.py" = ["F405", "F403"]
"config/settings/features.py" = ["F821"]
"**/migrations/*.py" = ["N", "E501", "I001"]
"**/tests/*.py" = ["S106"]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
strict = true
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.local"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "--reuse-db --cov=. --cov-report=term-missing"

[tool.coverage.run]
omit = ["*/migrations/*", "*/tests/*", "manage.py", "tasks/celery.py"]
